version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Mini PaaS — Docker Swarm Stack
# Kullanim: docker stack deploy -c docker-stack.yml mini-paas
# ─────────────────────────────────────────────────────────────────────────────

secrets:
  jwt_secret:
    external: true
  webhook_secret:
    external: true
  github_client_secret:
    external: true
  ngrok_authtoken:
    external: true

services:

  # ── 1. TRAEFIK ────────────────────────────────────────────────
  traefik:
    image: traefik:v2.10
    networks:
      - paas-net
    command:
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--providers.docker=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--log.level=ERROR"
    ports:
      - "8090:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 2. AUTH SERVICE ───────────────────────────────────────────
  auth-service:
    build: ./auth-service
    # NOT: Swarm'da build desteklenmez; onceden image build edip push etmek gerekir.
    # Simdilik gelistirme asamasinda docker-compose ile build, stack ile deploy yapilabilir.
    # Veya: image: localhost:5001/auth-service:latest (local registry ile)
    image: mini-paas/auth-service:latest
    networks:
      - paas-net
    ports:
      - "5002:8001"
    volumes:
      - auth-data:/app/data
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
    secrets:
      - jwt_secret
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      # FAZ 4: SQLite dosyası her replica'da ayrı olduğundan replicas=1 zorunlu.
      # Çözüm: Faz 5'te PostgreSQL'e geçince replicas artırılabilir.
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 3. DEPLOY SERVICE ─────────────────────────────────────────
  deploy-service:
    image: mini-paas/deploy-service:latest
    networks:
      - paas-net
    ports:
      - "5003:8003"
    volumes:
      - deploy-data:/app/data
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - BUILDER_SERVICE_URL=http://builder-service:5000
      - GITHUB_SERVICE_URL=http://github-service:8002
      - REDIS_URL=redis://redis:6379
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
    secrets:
      - jwt_secret
      - webhook_secret
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      # FAZ 4: SQLite dosyası her replica'da ayrı olduğundan replicas=1 zorunlu.
      # Çözüm: Faz 5'te PostgreSQL'e geçince replicas artırılabilir.
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 4. GITHUB SERVICE ─────────────────────────────────────────
  github-service:
    image: mini-paas/github-service:latest
    networks:
      - paas-net
    ports:
      - "5004:8002"
    volumes:
      - github-data:/app/data
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - DEPLOY_SERVICE_URL=http://deploy-service:8003
      - REDIS_URL=redis://redis:6379
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
    secrets:
      - jwt_secret
      - github_client_secret
      - webhook_secret
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      # FAZ 4: SQLite dosyası her replica'da ayrı olduğundan replicas=1 zorunlu.
      # Çözüm: Faz 5'te PostgreSQL'e geçince replicas artırılabilir.
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 5. BUILDER SERVICE ────────────────────────────────────────
  # replicas: 1 — Docker socket erisimi ve traefik_dynamic.yml yazma
  # islemi tek node'da olmali; birden fazla replica race condition olusturur.
  builder-service:
    image: mini-paas/builder-service:latest
    ports:
      - "5000:5000"
    networks:
      - paas-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 6. REDIS ──────────────────────────────────────────────────
  # Circuit breaker state ve token cache icin.
  # deploy-service ve github-service bu servisi kullanir.
  redis:
    image: redis:7-alpine
    networks:
      - paas-net
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 7. PROMETHEUS ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - paas-net
    ports:
      - "9090:9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 8. GRAFANA ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    networks:
      - paas-net
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

# ── 9. NGROK ──────────────────────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http github-service:8002 --log=stdout
    networks:
      - paas-net
    ports:
      - "4040:4040"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

volumes:
  prometheus-data:
  grafana-data:
  redis-data:
  auth-data:
  deploy-data:
  github-data:

networks:
  paas-net:
    driver: overlay
    attachable: true
    # attachable: true olmali — builder deploy edilen app container'larini
    # bu ag'a bagliyor. Olmasa app container'lari Traefik'e ulasalamaz.