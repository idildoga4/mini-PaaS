version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Mini PaaS — Docker Swarm Stack
# Kullanim: docker stack deploy -c docker-stack.yml mini-paas
# FAZ 6 degisiklikleri:
#   - dashboard-service eklendi (Nginx — index.html serve eder)
#   - auth-service'den StaticFiles mount kaldirildi
# FAZ 7 degisiklikleri:
#   - postgres servisi eklendi (auth_db, deploy_db, github_db)
#   - postgres_password Docker Secret olarak eklendi
#   - auth/deploy/github servisler DATABASE_URL ile PostgreSQL'e baglanıyor
#   - SQLite volume'ları kaldırıldı (auth-data, deploy-data, github-data)
#   - auth/deploy/github replicas: 1 → 2 (PostgreSQL sayesinde güvenli)
# ─────────────────────────────────────────────────────────────────────────────

secrets:
  jwt_secret:
    external: true
  webhook_secret:
    external: true
  github_client_secret:
    external: true
  ngrok_authtoken:
    external: true
  postgres_password:
    external: true

services:

  # ── 1. TRAEFIK ────────────────────────────────────────────────
  traefik:
    image: traefik:v2.10
    networks:
      - paas-net
    command:
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--providers.docker=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--log.level=ERROR"
    ports:
      - "8090:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 10
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 2. POSTGRESQL ─────────────────────────────────────────────
  # Tek PostgreSQL instance, 3 database barındırıyor:
  #   auth_db (POSTGRES_DB), deploy_db ve github_db (init script ile)
  postgres:
    image: postgres:16-alpine
    networks:
      - paas-net
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_USER=paas_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=auth_db
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paas_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager   # veri tutarlılığı için tek node'da çalışmalı
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 3. DASHBOARD SERVICE ──────────────────────────────────────
  dashboard-service:
    build: ./dashboard-service
    image: mini-paas/dashboard-service:latest
    networks:
      - paas-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 4. AUTH SERVICE ───────────────────────────────────────────
  auth-service:
    build: ./auth-service
    image: mini-paas/auth-service:latest
    networks:
      - paas-net
    ports:
      - "5002:8001"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=auth_db
    secrets:
      - jwt_secret
      - postgres_password
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      # FAZ 7: PostgreSQL sayesinde replicas: 2 güvenli
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 5. DEPLOY SERVICE ─────────────────────────────────────────
  deploy-service:
    build: ./deploy-service
    image: mini-paas/deploy-service:latest
    networks:
      - paas-net
    ports:
      - "5003:8003"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - BUILDER_SERVICE_URL=http://builder-service:5000
      - GITHUB_SERVICE_URL=http://github-service:8002
      - REDIS_URL=redis://redis:6379
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=deploy_db
      - SERVICE_NAME=deploy-service
    secrets:
      - jwt_secret
      - webhook_secret
      - postgres_password
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      # FAZ 7: PostgreSQL sayesinde replicas: 2 güvenli
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 6. GITHUB SERVICE ─────────────────────────────────────────
  github-service:
    build: ./github-service
    image: mini-paas/github-service:latest
    networks:
      - paas-net
    ports:
      - "5004:8002"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - DEPLOY_SERVICE_URL=http://deploy-service:8003
      - REDIS_URL=redis://redis:6379
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=github_db
      - SERVICE_NAME=github-service
    secrets:
      - jwt_secret
      - github_client_secret
      - webhook_secret
      - postgres_password
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      # FAZ 7: PostgreSQL sayesinde replicas: 2 güvenli
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 7. BUILDER SERVICE ────────────────────────────────────────
  builder-service:
    build: ./builder-service
    image: mini-paas/builder-service:latest
    ports:
      - "5000:5000"
    networks:
      - paas-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 8. REDIS ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    networks:
      - paas-net
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 9. PROMETHEUS ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - paas-net
    ports:
      - "9090:9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 10. GRAFANA ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    networks:
      - paas-net
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  # ── 11. NGROK ─────────────────────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http --url=${NGROK_DOMAIN} --pooling-enabled=true github-service:8002 --log=stdout
    networks:
      - paas-net
    ports:
      - "4040:4040"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  redis-data:

configs:
  prometheus-config:
    external: true

networks:
  paas-net:
    driver: overlay
    attachable: true