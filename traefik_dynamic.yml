http:
  routers:
    auth-router:
      entryPoints:
      - web
      priority: 10
      rule: Host(`localhost`) && (PathPrefix(`/api/register`) || PathPrefix(`/api/login`)
        || PathPrefix(`/api/me`) || PathPrefix(`/api/auth`))
      service: auth-service
    dashboard-router:
      entryPoints:
      - web
      priority: 1
      rule: Host(`localhost`)
      service: dashboard-service
    deploy-router:
      entryPoints:
      - web
      priority: 10
      rule: Host(`localhost`) && (PathPrefix(`/api/deploy`) || PathPrefix(`/api/deployments`)
        || PathPrefix(`/api/status`) || PathPrefix(`/api/webhook`) || PathPrefix(`/api/projects`)
        || PathPrefix(`/api/internal`))
      service: deploy-service
    github-router:
      entryPoints:
      - web
      priority: 10
      rule: Host(`localhost`) && PathPrefix(`/api/github`)
      service: github-service
    idildoga4-minipaastest:
      entryPoints:
      - web
      rule: Host(`idildoga4-minipaastest.localhost`)
      service: idildoga4-minipaastest
    lolcutuana28-minipaastest:
