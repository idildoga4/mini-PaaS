version: '3.8'

services:

  # ── 1. TRAEFIK ────────────────────────────────────────────────
  traefik:
    image: traefik:v2.10
    container_name: traefik_proxy
    networks:
      - paas-net
    command:
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--providers.docker=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--log.level=ERROR"
    ports:
      - "8090:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml

  # ── 2. AUTH SERVICE ───────────────────────────────────────────
  auth-service:
    env_file:
      - .env
    build: ./auth-service
    container_name: paas_auth
    networks:
      - paas-net
    ports:
      - "5002:8001"
    volumes:
      - ./auth-service/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── 3. DEPLOY SERVICE ─────────────────────────────────────────
  deploy-service:
    env_file:
      - .env
    build: ./deploy-service
    container_name: paas_deploy
    networks:
      - paas-net
    ports:
      - "5003:8003"
    volumes:
      - ./deploy-service/data:/app/data
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - BUILDER_SERVICE_URL=http://builder-service:5000
      - GITHUB_SERVICE_URL=http://github-service:8002
    depends_on:
      - auth-service
      - builder-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── 4. GITHUB SERVICE ─────────────────────────────────────────
  github-service:
    env_file:
      - .env
    build: ./github-service
    container_name: paas_github
    networks:
      - paas-net
    ports:
      - "5004:8002"
    volumes:
      - ./github-service/data:/app/data
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - DEPLOY_SERVICE_URL=http://deploy-service:8003
    depends_on:
      - auth-service
      - deploy-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── 5. BUILDER SERVICE ────────────────────────────────────────
  builder-service:
    env_file:
      - .env
    build: ./builder-service
    container_name: paas_builder
    ports:
      - "5000:5000"
    networks:
      - paas-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── 6. PROMETHEUS ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: paas_monitor
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - paas-net
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ── 7. GRAFANA ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: paas_dashboard
    networks:
      - paas-net
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped

  # ── 8. NGROK ──────────────────────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    container_name: paas_ngrok
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http --domain=${NGROK_DOMAIN} paas_github:8002 --log=stdout
    networks:
      - paas-net
    ports:
      - "4040:4040"
    restart: unless-stopped
    depends_on:
      - github-service

volumes:
  prometheus-data:
  grafana-data:

networks:
  paas-net:
    name: paas-net
    driver: bridge