version: '3.8'

# FAZ 6 degisiklikleri:
#   - dashboard-service eklendi (Nginx — index.html serve eder)
# FAZ 7 degisiklikleri:
#   - postgres servisi eklendi (auth_db, deploy_db, github_db)
#   - auth/deploy/github servisler DATABASE_URL ile PostgreSQL'e baglanıyor
#   - SQLite volume bind mount'ları kaldırıldı (./servis/data:/app/data)
#   - depends_on postgres: condition: service_healthy eklendi

services:

  # ── 1. TRAEFIK ────────────────────────────────────────────────
  traefik:
    image: traefik:v2.10
    container_name: traefik_proxy
    networks:
      - paas-net
    command:
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--providers.docker=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--log.level=ERROR"
    ports:
      - "8090:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml

  # ── 2. POSTGRESQL ─────────────────────────────────────────────
  # Tek PostgreSQL instance, 3 database barındırıyor:
  #   auth_db, deploy_db, github_db
  # postgres-init/01_create_databases.sql ile deploy_db ve github_db otomatik oluşur.
  postgres:
    image: postgres:16-alpine
    container_name: paas_postgres
    networks:
      - paas-net
    ports:
      - "5433:5432"       # host'tan migration script erişimi için
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_USER=paas_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-paas_pass}
      - POSTGRES_DB=auth_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paas_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── 3. DASHBOARD SERVICE ──────────────────────────────────────
  # FAZ 6: Dashboard auth-service'den ayrıldı.
  # Auth service down olsa bile dashboard erişilebilir kalır.
  dashboard-service:
    build: ./dashboard-service
    container_name: paas_dashboard_ui
    networks:
      - paas-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── 4. AUTH SERVICE ───────────────────────────────────────────
  auth-service:
    env_file:
      - .env
    build: ./auth-service
    container_name: paas_auth
    networks:
      - paas-net
    ports:
      - "5002:8001"
    environment:
      - DATABASE_URL=postgresql://paas_user:${POSTGRES_PASSWORD:-paas_pass}@postgres:5432/auth_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── 5. DEPLOY SERVICE ─────────────────────────────────────────
  deploy-service:
    env_file:
      - .env
    build: ./deploy-service
    container_name: paas_deploy
    networks:
      - paas-net
    ports:
      - "5003:8003"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - BUILDER_SERVICE_URL=http://builder-service:5000
      - GITHUB_SERVICE_URL=http://github-service:8002
      - DATABASE_URL=postgresql://paas_user:${POSTGRES_PASSWORD:-paas_pass}@postgres:5432/deploy_db
      - REDIS_URL=redis://redis:6379
      - SERVICE_NAME=deploy-service
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      builder-service:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── 6. GITHUB SERVICE ─────────────────────────────────────────
  github-service:
    env_file:
      - .env
    build: ./github-service
    container_name: paas_github
    networks:
      - paas-net
    ports:
      - "5004:8002"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - DEPLOY_SERVICE_URL=http://deploy-service:8003
      - DATABASE_URL=postgresql://paas_user:${POSTGRES_PASSWORD:-paas_pass}@postgres:5432/github_db
      - REDIS_URL=redis://redis:6379
      - SERVICE_NAME=github-service
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      deploy-service:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── 7. BUILDER SERVICE ────────────────────────────────────────
  builder-service:
    env_file:
      - .env
    build: ./builder-service
    container_name: paas_builder
    ports:
      - "5000:5000"
    networks:
      - paas-net
    environment:
    - GITHUB_TOKEN=
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── 8. PROMETHEUS ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: paas_redis
    networks:
      - paas-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: paas_monitor
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - paas-net
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ── 9. GRAFANA ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: paas_grafana
    networks:
      - paas-net
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped

  # ── 10. NGROK ─────────────────────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    container_name: paas_ngrok
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http --domain=${NGROK_DOMAIN} github-service:8002 --log=stdout
    networks:
      - paas-net
    ports:
      - "4040:4040"
    restart: unless-stopped
    depends_on:
      - github-service

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  # auth-data, deploy-data, github-data kaldırıldı — artık PostgreSQL kullanıyor

networks:
  paas-net:
    name: paas-net
    driver: bridge