version: '3.8'

services:
  # --- 1. TRAFIK POLİSİ (Traefik) ---
  traefik:
    image: traefik:v2.10
    container_name: traefik_proxy
    networks:
      - paas-net
    command:
      # --- Temel Ayarlar ---
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"

      # --- Yönlendirme: SADECE dosya modu ---
      # Docker provider KAPALI — Windows/Docker Desktop'ta socket hatası üretiyor.
      # Tüm routing traefik_dynamic.yml üzerinden yönetiliyor:
      #   - localhost → API Gateway (dashboard)
      #   - demo-app.localhost → app-demo-app container'ı  (builder ekler)
      #   - test.localhost → app-test container'ı          (builder ekler)
      - "--providers.docker=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"

      # --- İzleme (Prometheus metrikleri) ---
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"

      # --- Log seviyesi ---
      # ERROR: sadece gerçek hatalar görünsün, log ekranı kirlenmesin
      - "--log.level=ERROR"
    ports:
      - "8090:80"   # Site Girişi
      - "8080:8080" # Panel ve Metrikler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml

  # --- 2. API SERVİSİ ---
  api-gateway:
    build: ./api-gateway
    container_name: paas_api
    networks:
      - paas-net
    ports:
      - "5001:8000" # Bypass portu
    volumes:
      - ./data:/app/data

  # --- 3. BUILDER SERVİSİ ---
  builder-service:
    build: ./builder-service
    container_name: paas_builder
    ports:
      - "5000:5000"
    networks:
      - paas-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # traefik_dynamic.yml builder tarafından güncelleniyor
      # Traefik ve Builder aynı dosyayı paylaşıyor
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml
    environment:
      # GitHub Personal Access Token — private repo'ları klonlamak için
      # Token almak: GitHub → Settings → Developer settings → Personal access tokens
      # Buraya kendi token'ınızı yazın, ASLA GitHub'a push etmeyin!
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}

  # --- 4. VERİ TOPLAYICI (Prometheus) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: paas_monitor
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - paas-net
    ports:
      - "9090:9090"

  # --- 5. GRAFİK EKRANI (Grafana) ---
  grafana:
    image: grafana/grafana:latest
    container_name: paas_dashboard
    networks:
      - paas-net
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

# --- AĞ ---
networks:
  paas-net:
    name: paas-net
    driver: bridge